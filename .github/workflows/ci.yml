name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # the main suite ≈ 18 min under software GL, plus the flake guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Backlog, lint, unit tests, build, e2e
        run: npm run check
      # Flake guard: e2e specs this PR adds or changes run several times in a row.
      - name: Flake guard (changed e2e specs, repeated)
        if: github.event_name == 'pull_request' && hashFiles('scripts/e2e-repeat-changed.mjs') != ''
        run: node scripts/e2e-repeat-changed.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
