name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Four jobs side by side, and `check` (the required status) passes only if all of them did.
# The e2e suite runs under software GL and grew to 20–27 min serially (45+ on a slow runner):
# split into shards it fits well inside its limit, and a slow runner costs one shard, not the run.
jobs:
  static:
    name: Backlog, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-backlog.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 35   # four ways since #181: the suite (≈ 101 min on these runners) outgrew three
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser only: the runner image ships Chrome, so Chromium's system libraries are already
      # there. The apt mirror behind --with-deps hung one job for 35 minutes and failed three
      # outright (exit 100); it is the fallback now, only if the browser won't launch without it.
      - run: |
          npx playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 240 npx playwright install --with-deps chromium && exit 0; echo "browser deps attempt $i failed; retrying"; done; exit 1
        timeout-minutes: 14
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The HUD and title audits (scripts/hud-audit.mjs, title-audit.mjs via npm run audit), in six shards: every viewport,
  # both HUD states, measured on screenshots: overlaps, offscreen, text < 11 px, labels < 4.5:1, theatre
  # targets < 44 px. Not in 'check' yet: it becomes required once it has run green on these runners.
  audit:
    name: audit ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 40   # three shards ran past 45 minutes on these runners (twice the local time)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 240 npx playwright install --with-deps chromium && exit 0; echo "browser deps attempt $i failed; retrying"; done; exit 1
        timeout-minutes: 14
      - run: npm run build
      - run: npm run audit -- --shard=${{ matrix.shard }}/6 --out=audit-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-shots-${{ matrix.shard }}
          path: audit-shots/
          retention-days: 7

  # Flake guard: e2e specs this PR adds or changes run several times in a row, with no retries.
  guard:
    name: Flake guard ${{ matrix.shard }}/4 (changed e2e specs, repeated)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35   # split 4 ways: a PR touching 14 specs ran one of 2 past 50 minutes, #181's 20 one of 3 past 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser only: the runner image ships Chrome, so Chromium's system libraries are already
      # there. The apt mirror behind --with-deps hung one job for 35 minutes and failed three
      # outright (exit 100); it is the fallback now, only if the browser won't launch without it.
      - run: |
          npx playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 240 npx playwright install --with-deps chromium && exit 0; echo "browser deps attempt $i failed; retrying"; done; exit 1
        timeout-minutes: 14
      - if: hashFiles('scripts/e2e-repeat-changed.mjs') != ''
        run: node scripts/e2e-repeat-changed.mjs
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-guard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  check:
    name: check
    needs: [static, e2e, guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed (the guard is skipped on main)
        run: |
          echo "static=${{ needs.static.result }} e2e=${{ needs.e2e.result }} guard=${{ needs.guard.result }}"
          [ "${{ needs.static.result }}" = success ] || exit 1
          [ "${{ needs.e2e.result }}" = success ] || exit 1
          case "${{ needs.guard.result }}" in success|skipped) ;; *) exit 1 ;; esac
