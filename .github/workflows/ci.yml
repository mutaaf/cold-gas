name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Four jobs side by side, and `check` (the required status) passes only if all of them did.
# The e2e suite runs under software GL and grew to 20–27 min serially (45+ on a slow runner):
# split into shards it fits well inside its limit, and a slow runner costs one shard, not the run.
jobs:
  static:
    name: Backlog, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-backlog.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner's apt mirror hangs now and then (once for a job's whole 35 minutes): try three
      # times, four minutes each, instead of waiting it out.
      - run: for i in 1 2 3; do timeout 240 npx playwright install --with-deps chromium && exit 0; echo "browser install attempt $i stalled; retrying"; done; exit 1
        timeout-minutes: 14
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Flake guard: e2e specs this PR adds or changes run several times in a row, with no retries.
  guard:
    name: Flake guard ${{ matrix.shard }}/3 (changed e2e specs, repeated)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35   # split 3 ways: a PR touching 14 specs ran one guard past 50 minutes
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner's apt mirror hangs now and then (once for a job's whole 35 minutes): try three
      # times, four minutes each, instead of waiting it out.
      - run: for i in 1 2 3; do timeout 240 npx playwright install --with-deps chromium && exit 0; echo "browser install attempt $i stalled; retrying"; done; exit 1
        timeout-minutes: 14
      - if: hashFiles('scripts/e2e-repeat-changed.mjs') != ''
        run: node scripts/e2e-repeat-changed.mjs
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-guard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  check:
    name: check
    needs: [static, e2e, guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed (the guard is skipped on main)
        run: |
          echo "static=${{ needs.static.result }} e2e=${{ needs.e2e.result }} guard=${{ needs.guard.result }}"
          [ "${{ needs.static.result }}" = success ] || exit 1
          [ "${{ needs.e2e.result }}" = success ] || exit 1
          case "${{ needs.guard.result }}" in success|skipped) ;; *) exit 1 ;; esac
